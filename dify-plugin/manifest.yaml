repo: https://github.com/useapi/notebooklm-api
contact: support@useapi.net
label:
  en_US: Gemini Notebook (NotebookLM) by useapi.net
  zh_Hans: Gemini Notebook（NotebookLM），由 useapi.net 提供
  ja_JP: Gemini Notebook（NotebookLM）by useapi.net
  pt_BR: Gemini Notebook (NotebookLM) por useapi.net
description:
  en_US: "Google Gemini Notebook (formerly NotebookLM) in Dify: notebooks, sources, cited chat, Deep Research, Audio Overview podcasts, Video Overviews, slides, reports, quizzes and mind maps. Third-party API by useapi.net, not affiliated with Google. Needs a useapi.net subscription ($15/month) and your Google AI subscription, free plan included."
  zh_Hans: "在 Dify 中使用 Google Gemini Notebook（原名 NotebookLM）：笔记本、来源、带引用的聊天、Deep Research、音频概览播客、视频概览、演示文稿、报告、测验和思维导图。由 useapi.net 提供的第三方 API，与 Google 无关联。需要 useapi.net 订阅（每月 15 美元）和你的 Google AI 订阅（含免费方案）。"
  ja_JP: "Dify で Google Gemini Notebook（旧称 NotebookLM）を利用：ノートブック、ソース、引用付きチャット、Deep Research、音声解説ポッドキャスト、動画解説、スライド、レポート、テスト、マインドマップ。useapi.net によるサードパーティ API で、Google とは提携していません。useapi.net のサブスクリプション（月額 15 ドル）とお使いの Google AI サブスクリプション（無料プランも可）が必要です。"
  pt_BR: "Google Gemini Notebook (antes chamado NotebookLM) no Dify: notebooks, fontes, chat com citações, Deep Research, podcasts de Visão geral em áudio, Visões gerais em vídeo, slides, relatórios, testes e mapas mentais. API de terceiros da useapi.net, sem afiliação com o Google. Requer assinatura da useapi.net (US$ 15/mês) e sua assinatura do Google AI, plano gratuito incluído."
