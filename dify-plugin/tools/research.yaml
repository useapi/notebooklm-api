# Generated by dev/gen_tools.py from dev/specs.py. Edit the specs, then re-run the generator.
identity:
  name: research
  author: useapi
  label:
    en_US: Research (Discover sources / Deep Research)
    zh_Hans: 研究（发现来源 / Deep Research）
    ja_JP: リサーチ（ソースを探す / Deep Research）
    pt_BR: Pesquisa (Descobrir fontes / Deep Research)
description:
  human:
    en_US: Let Google find web sources for a question, or write a Deep Research report. Import the results next.
    zh_Hans: 让 Google 为问题查找网络来源，或撰写 Deep Research 报告，然后导入结果。
    ja_JP: 質問に合うウェブソースを Google に探させるか、Deep Research レポートを作成させます。結果は次にインポートします。
    pt_BR: Deixa o Google encontrar fontes na web para uma pergunta, ou escrever um relatório Deep Research. Depois importe os resultados.
  llm: Run NotebookLM research on a notebook. type fast (Discover sources, ~15 s) returns web sources; type deep (Deep Research, 3 to 5 minutes) also writes a Markdown report. Sources are not added until you call Import research results.
parameters:
- name: notebook
  type: string
  required: true
  label:
    en_US: Notebook ID
    zh_Hans: 笔记本 ID
    ja_JP: ノートブック ID
    pt_BR: ID do notebook
  human_description:
    en_US: The notebook id returned by List notebooks or Create notebook.
    zh_Hans: 由“列出笔记本”或“创建笔记本”返回的笔记本 ID。
    ja_JP: 「ノートブック一覧」または「ノートブックを作成」で返されるノートブック ID。
    pt_BR: O ID do notebook retornado por Listar notebooks ou Criar notebook.
  llm_description: The notebook id, e.g. user:12345-user@example.com-notebook:<uuid>, from List notebooks or Create notebook.
  form: llm
- name: query
  type: string
  required: true
  label:
    en_US: Question
    zh_Hans: 问题
    ja_JP: 質問
    pt_BR: Pergunta
  human_description:
    en_US: What to research (1 to 2,000 characters).
    zh_Hans: 研究的内容（1 到 2,000 个字符）。
    ja_JP: 調べる内容（1〜2,000 文字）。
    pt_BR: O que pesquisar (1 a 2.000 caracteres).
  llm_description: What to research, 1 to 2,000 characters.
  form: llm
- name: type
  type: select
  required: false
  label:
    en_US: Research type
    zh_Hans: 研究类型
    ja_JP: リサーチの種類
    pt_BR: Tipo de pesquisa
  human_description:
    en_US: 'Fast: Discover sources (default). Deep: Deep Research report.'
    zh_Hans: 快速：发现来源（默认）。深度：Deep Research 报告。
    ja_JP: 高速：ソースを探す（既定）。詳細：Deep Research レポート。
    pt_BR: 'Rápida: Descobrir fontes (padrão). Profunda: relatório Deep Research.'
  llm_description: 'Fast: Discover sources (default). Deep: Deep Research report. One of: fast, deep. Leave empty for the default.'
  form: llm
  options:
  - value: fast
    label:
      en_US: Fast (Discover sources)
      zh_Hans: 快速（发现来源）
      ja_JP: 高速（ソースを探す）
      pt_BR: Rápida (Descobrir fontes)
  - value: deep
    label:
      en_US: Deep Research
      zh_Hans: Deep Research（深度研究）
      ja_JP: Deep Research（詳細リサーチ）
      pt_BR: Deep Research (profunda)
- name: source
  type: select
  required: false
  label:
    en_US: Search in
    zh_Hans: 搜索范围
    ja_JP: 検索先
    pt_BR: Pesquisar em
  human_description:
    en_US: Web (default) or the account's Google Drive (fast only).
    zh_Hans: 网络（默认）或账号的 Google 云端硬盘（仅限快速）。
    ja_JP: ウェブ（既定）またはアカウントの Google ドライブ（高速のみ）。
    pt_BR: Web (padrão) ou o Google Drive da conta (só rápida).
  llm_description: 'Web (default) or the account''s Google Drive (fast only). One of: web, drive. Leave empty for the default.'
  form: llm
  options:
  - value: web
    label:
      en_US: Web
      zh_Hans: 网络
      ja_JP: ウェブ
      pt_BR: Web
  - value: drive
    label:
      en_US: Google Drive
      zh_Hans: Google 云端硬盘
      ja_JP: Google ドライブ
      pt_BR: Google Drive
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the result
    zh_Hans: 等待结果
    ja_JP: 結果を待つ
    pt_BR: Aguardar o resultado
  human_description:
    en_US: 'Wait until the job finishes (up to the maximum wait). Off: return the job id at once.'
    zh_Hans: 等待任务完成（不超过最长等待时间）。关闭时立即返回任务 ID。
    ja_JP: ジョブの完了まで待ちます（最大待機時間まで）。オフにするとすぐにジョブ ID を返します。
    pt_BR: 'Aguarda o job terminar (até o tempo máximo). Desligado: retorna o ID do job na hora.'
  form: form
  default: true
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 540 seconds (default 120). A job still running is returned with its job id.
    zh_Hans: 最长等待时间，10 到 540 秒（默认 120）。仍在运行的任务会连同任务 ID 一起返回。
    ja_JP: 待機時間は 10〜540 秒（既定 120）。実行中のジョブはジョブ ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 540 segundos (padrão 120). Um job ainda em execução é retornado com seu ID.
  form: form
  default: 120
  min: 10
  max: 540
- name: reply_url
  type: string
  required: false
  label:
    en_US: Webhook URL
    zh_Hans: Webhook 地址
    ja_JP: Webhook URL
    pt_BR: URL de webhook
  human_description:
    en_US: Optional public URL that receives the finished job record by POST.
    zh_Hans: 可选。接收已完成任务记录（POST）的公开地址。
    ja_JP: 任意。完了したジョブ記録を POST で受け取る公開 URL。
    pt_BR: URL pública opcional que recebe o registro do job finalizado via POST.
  form: form
output_schema:
  type: object
  properties:
    jobid:
      type: string
    status:
      type: string
    notebook:
      type: string
    artifact:
      type: string
    title:
      type: string
    text:
      type: string
    file_urls:
      type: array
      items:
        type: string
extra:
  python:
    source: tools/research.py
