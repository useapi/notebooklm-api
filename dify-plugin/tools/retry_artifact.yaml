  llm_description: The artifact id, e.g. user:12345-user@example.com-artifact:<notebook uuid>:<artifact uuid>.
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the result
    zh_Hans: 等待结果
    ja_JP: 結果を待つ
    pt_BR: Aguardar o resultado
  human_description:
    en_US: 'Wait until the job finishes (up to the maximum wait). Off: return the job id at once.'
    zh_Hans: 等待任务完成（不超过最长等待时间）。关闭时立即返回任务 ID。
