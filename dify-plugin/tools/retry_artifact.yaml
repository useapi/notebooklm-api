    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 540 seconds (default 120). A job still running is returned with its job id.
    zh_Hans: 最长等待时间，10 到 540 秒（默认 120）。仍在运行的任务会连同任务 ID 一起返回。
