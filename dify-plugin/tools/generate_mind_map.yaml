    zh_Hans: 仅在未提供笔记本时使用：为本次请求新建的笔记本标题。
    ja_JP: ノートブック未指定時のみ使用：このリクエスト用に作成するノートブックのタイトル。
    pt_BR: 'Usado só sem notebook: o título do notebook criado para este pedido.'
  llm_description: 'Only when no notebook is given: title of the auto-created notebook (up to 200 characters).'
  form: llm
- name: email
  type: string
