  human_description:
    en_US: 'Text results only: delete the auto-created notebook when the job finishes.'
    zh_Hans: 仅限文本类结果：任务完成后删除自动创建的笔记本。
    ja_JP: テキスト結果のみ：ジョブ完了後に自動作成したノートブックを削除します。
    pt_BR: 'Só para resultados em texto: exclui o notebook criado automaticamente quando o job termina.'
  form: form
  default: false
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the result
    zh_Hans: 等待结果
    ja_JP: 結果を待つ
    pt_BR: Aguardar o resultado
  human_description:
    en_US: 'Wait until the job finishes (up to the maximum wait). Off: return the job id at once.'
