    zh_Hans: 仅在未提供笔记本时使用：网页或 YouTube 链接，每行一个。会为其新建一个笔记本。
    ja_JP: ノートブック未指定時のみ使用：ウェブページまたは YouTube のリンクを 1 行に 1 つ。新しいノートブックが作成されます。
    pt_BR: 'Usado só sem notebook: páginas web ou links do YouTube, um por linha. Um novo notebook é criado para eles.'
