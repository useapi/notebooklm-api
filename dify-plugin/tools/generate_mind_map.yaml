identity:
  name: generate_mind_map
  author: useapi
  label:
    en_US: Generate mind map
    zh_Hans: 生成思维导图
    ja_JP: マインドマップを生成
    pt_BR: Gerar mapa mental
description:
  human:
    en_US: A mind map of the topics in your sources. Give a notebook id, or URLs/text to create a notebook on the fly.
    zh_Hans: 来源中各主题的思维导图。可提供笔记本 ID，或直接提供网址/文本以自动创建笔记本。
    ja_JP: ソースのトピックをまとめたマインドマップ。ノートブック ID を指定するか、URL／テキストを渡してその場でノートブックを作成できます。
    pt_BR: Um mapa mental dos temas das suas fontes. Informe um ID de notebook, ou URLs/texto para criar um notebook na hora.
  llm: Generate a NotebookLM mind map; returns the JSON tree and an indented outline.
parameters:
