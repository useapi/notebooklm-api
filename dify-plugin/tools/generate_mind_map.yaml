    zh_Hans: 可选。已连接的 Google 账号。默认使用凭据中的邮箱，或最空闲的账号。
    ja_JP: 任意。接続済みの Google アカウント。省略時は認証情報のメール、または最も空いているアカウントを使います。
    pt_BR: Opcional. Uma conta Google conectada. O padrão é o e-mail das credenciais ou a conta menos ocupada.
  llm_description: Optional email of the Google account for a one-shot request. Leave empty to use the default account.
  form: llm
