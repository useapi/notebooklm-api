  type: string
  required: false
  label:
    en_US: Instructions
    zh_Hans: 说明
    ja_JP: 指示
    pt_BR: Instruções
  human_description:
    en_US: Optional. What to focus on or how to shape the result (up to 10,000 characters).
    zh_Hans: 可选。重点内容或结果的形式（最多 10,000 个字符）。
    ja_JP: 任意。重点や仕上がりの指示（最大 10,000 文字）。
    pt_BR: Opcional. No que focar ou como moldar o resultado (até 10.000 caracteres).
  llm_description: Optional focus or shaping instructions for the result, up to 10,000 characters.
  form: llm
- name: notebook
  type: string
  required: false
  label:
    en_US: Notebook ID
    zh_Hans: 笔记本 ID
