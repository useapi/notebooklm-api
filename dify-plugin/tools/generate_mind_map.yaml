  form: llm
- name: text
  type: string
  required: false
  label:
    en_US: Source text (one-shot)
    zh_Hans: 来源文本（一次性）
    ja_JP: ソーステキスト（ワンショット）
    pt_BR: Texto de fonte (uso único)
  human_description:
