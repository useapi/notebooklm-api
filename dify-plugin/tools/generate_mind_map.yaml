    en_US: The notebook id returned by List notebooks or Create notebook.
    zh_Hans: 由“列出笔记本”或“创建笔记本”返回的笔记本 ID。
    ja_JP: 「ノートブック一覧」または「ノートブックを作成」で返されるノートブック ID。
    pt_BR: O ID do notebook retornado por Listar notebooks ou Criar notebook.
  llm_description: The notebook id, e.g. user:12345-user@example.com-notebook:<uuid>, from List notebooks or Create notebook. Leave empty and give urls or text instead to create a one-shot notebook.
  form: llm
- name: sources
  type: string
  required: false
